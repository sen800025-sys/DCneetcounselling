<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful!</title>
    <link rel="icon" type="image/webp" href="../assets/logo.webp" />
    <!-- Use the existing global styles -->
    <link rel="stylesheet" href="../css/bundle.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .thank-you-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .success-icon {
            color: #16a34a;
            font-size: 64px;
            margin-bottom: 20px;
        }

        .thank-you-title {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .thank-you-msg {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-home:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="thank-you-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 class="thank-you-title">Payment Successful!</h1>
        <p class="thank-you-msg">
            We have received your payment successfully.<br>
            Your eBook(s) will be sent to your WhatsApp and Email within 12 hours.
        </p>

        <div id="order-summary"
            style="display:none; background:#f1f5f9; text-align:left; padding:20px; border-radius:10px; margin-bottom:30px;">
            <p style="margin:0 0 5px; font-size:14px; color:#475569;"><strong>Product:</strong> <span
                    id="summary-product"></span></p>
            <p style="margin:0 0 5px; font-size:14px; color:#475569;"><strong>Amount Paid:</strong> ₹<span
                    id="summary-amount"></span></p>
            <p id="coupon-row" style="margin:0 0 5px; font-size:14px; color:#475569; display:none;"><strong>Coupon
                    Applied:</strong> <span id="summary-coupon"></span></p>
            <p style="margin:0 0 0px; font-size:14px; color:#475569;"><strong>Order ID:</strong> <span
                    id="summary-id"></span></p>
        </div>

        <a href="/#orders" class="btn-home">Go to Profile</a>
    </div>

    <script>
        console.log('🔥 Thank You Page Loaded');

        const params = new URLSearchParams(window.location.search);
        const product = params.get('product');
        const amount = params.get('amount');
        const couponCode = params.get('coupon') || params.get('coupon_code') || "";
        
        // Extract ALL possible payment identifiers from URL params
        const razorpay_payment_id = params.get('razorpay_payment_id') || null;
        const razorpay_order_id = params.get('razorpay_order_id') || null;
        const razorpay_signature = params.get('razorpay_signature') || null;
        const url_order_id = params.get('order_id') || razorpay_payment_id || null;
        
        // The actual internal DB order_id (UUID) is in localStorage — this is the critical one
        const savedOrderId = localStorage.getItem("order_id");
        
        console.log('[ThankYou] URL params:', { url_order_id, razorpay_payment_id, razorpay_order_id, savedOrderId });

        if (product && amount && url_order_id) {
            // Setup GoAffPro Order BEFORE loader script
            if (!sessionStorage.getItem('gaff_tracked')) {
                let orderNumber = url_order_id;
                const prodLower = product.toLowerCase();
                if (prodLower.includes('ebook')) {
                    orderNumber = 'EBK_' + url_order_id;
                } else if (prodLower.includes('counselling') || prodLower.includes('counseling')) {
                    orderNumber = 'CNS_' + url_order_id;
                }

                window.goaffproOrder = {
                    id: orderNumber,
                    total: Number(amount),
                    currency: "INR",
                    coupon: couponCode.toUpperCase()
                };
                sessionStorage.setItem('gaff_tracked', 'true');
            }
        }

        // ── AUTO-VERIFY PAYMENT ON PAGE LOAD ──
        // This is the CRITICAL safety net for:
        //   1. Mobile UPI redirect flows (handler never fires)
        //   2. Popup flows where handler verification failed due to network
        //   3. Any other edge case where verify-payment wasn't called
        (async function autoVerifyPayment() {
            if (!savedOrderId) {
                console.log('[AutoVerify] No saved order_id in localStorage. Cannot verify.');
                return;
            }
            
            // Don't re-verify if the payment page handler already verified this order
            if (sessionStorage.getItem('payment_verified_' + savedOrderId)) {
                console.log('[AutoVerify] Order already verified by payment handler. Skipping.');
                return;
            }
            
            // Set lock immediately
            sessionStorage.setItem('payment_verified_' + savedOrderId, 'true');

            const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                ? 'https://rlqmdylbzapyepuwncwt.supabase.co/functions/v1' 
                : 'https://rlqmdylbzapyepuwncwt.supabase.co/functions/v1';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJscW1keWxiemFweWVwdXduY3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNTcwNzYsImV4cCI6MjA5MTgzMzA3Nn0.oNNK1pwLnykQlNfUkw7IdB-ZBkKDoWxszsKDSIjsLeo';
            
            // Determine the best payment_id to send
            const paymentIdToSend = razorpay_payment_id || ('pay_redirect_' + Date.now());
            
            console.log('[AutoVerify] Verifying order:', savedOrderId, 'with payment_id:', paymentIdToSend);
            
            // Retry up to 3 times with increasing delay
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    
                    const res = await fetch(BACKEND_URL + '/verify-payment', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json', 
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY 
                        },
                        signal: controller.signal,
                        body: JSON.stringify({
                            order_id: savedOrderId,
                            razorpay_payment_id: paymentIdToSend,
                            razorpay_order_id: razorpay_order_id || null,
                            razorpay_signature: razorpay_signature || null
                        })
                    });
                    clearTimeout(timeoutId);
                    
                    const data = await res.json();
                    console.log(`[AutoVerify] Attempt ${attempt} response:`, data);
                    
                    if (data.success) {
                        console.log('[AutoVerify] ✅ Payment verified successfully!');
                        break;
                    }
                } catch (err) {
                    console.error(`[AutoVerify] Attempt ${attempt} error:`, err);
                    if (attempt < 3) {
                        await new Promise(r => setTimeout(r, attempt * 1000));
                    }
                }
            }
        })();

        document.addEventListener("DOMContentLoaded", function () {
            if (product && amount) {
                document.getElementById('summary-product').textContent = product;
                document.getElementById('summary-amount').textContent = amount;
                document.getElementById('summary-id').textContent = url_order_id || savedOrderId || "N/A";

                if (couponCode) {
                    document.getElementById('summary-coupon').textContent = couponCode;
                    document.getElementById('coupon-row').style.display = 'block';
                }

                document.getElementById('order-summary').style.display = 'block';
            }

            // Cleanup LocalStorage after 5 seconds (plenty of time for autoVerify to finish)
            setTimeout(function() {
                localStorage.removeItem("coupon");
                localStorage.removeItem("affiliate_ref");
                localStorage.removeItem("order_id");
            }, 5000);
        });
    </script>
    <script async src="https://static.goaffpro.com/loader.js"></script>

</body>
