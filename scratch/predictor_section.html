        .predictor-slider::-webkit-slider-thumb {
          -webkit-appearance: none;

        .predictor-btn {

          border-radius: 24px;
          background: linear-gradient(to right, #FFD233, #B026FF);

          font-size: 30px;

          border: none;
          padding: 0 40px;
          cursor: pointer;
          box-shadow: 0 0 35px rgba(255,210,51,0.4);
          transition: transform 0.3s, box-shadow 0.3s;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 15px;

          transform: scale(1.03);
          box-shadow: 0 0 50px rgba(255,210,51,0.6);

        .predictor-result-card {

      <div class="predictor-glow-circle"></div>

      <div class="predictor-content">

            <span class="line1">DC</span>
            <span class="line2">RANK PREDICTOR</span>
          </h1>
          <p class="predictor-subtitle">Enter your expected NEET score and get your estimated All India Rank instantly.</p>
        </div>

        <div class="predictor-card">
          <h2 class="predictor-card-title">Enter Your Expected Score</h2>
          
          <div class="predictor-score-display">
            <span id="predictorScoreValue">620</span><span class="predictor-score-max">/720</span>
          </div>

          <div class="predictor-slider-container">
            <input type="range" id="predictorScoreSlider" class="predictor-slider" min="0" max="720" value="620">
          </div>

          <button id="predictRankBtn" class="predictor-btn">
            PREDICT MY RANK <i class="fas fa-arrow-right"></i>
          </button>
        </div>

        <div id="predictorResultSection" class="predictor-result-section">
          <div class="predictor-result-card">
            <div class="predictor-result-badge">YOUR PREDICTED RANK</div>
            <div id="predictorRankResult" class="predictor-rank-display">--</div>
            <div class="predictor-result-label">ESTIMATED ALL INDIA RANK</div>
          </div>
        </div>
      </div>

      <script>
        (function() {
          const slider = document.getElementById('predictorScoreSlider');
          const scoreValue = document.getElementById('predictorScoreValue');
          const predictBtn = document.getElementById('predictRankBtn');
          const resultSection = document.getElementById('predictorResultSection');
          const rankResult = document.getElementById('predictorRankResult');

          function updateSliderBackground() {
            const val = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.background = `linear-gradient(to right, #FFD233 ${val}%, #D45BFF ${val}%, rgba(255,255,255,0.12) ${val}%)`;
          }

          slider.addEventListener('input', function() {
            scoreValue.textContent = this.value;
            updateSliderBackground();
            resultSection.style.display = 'none';
          });
          
          updateSliderBackground();

          predictBtn.addEventListener('click', function() {
            const score = parseInt(slider.value, 10);
            let rank = 1;
            
            if (score >= 715) rank = Math.floor(Math.random() * 50) + 1;
            else if (score >= 700) rank = Math.floor(Math.random() * 500) + 50;
            else if (score >= 650) rank = Math.floor(Math.random() * 5000) + 1000;
            else if (score >= 600) rank = Math.floor(Math.random() * 15000) + 6000;
            else if (score >= 500) rank = Math.floor(Math.random() * 50000) + 20000;
            else if (score >= 400) rank = Math.floor(Math.random() * 100000) + 70000;
            else if (score >= 300) rank = Math.floor(Math.random() * 300000) + 150000;
            else rank = Math.floor(Math.random() * 1000000) + 500000;
            
            resultSection.style.display = 'block';
            
            let current = 0;
            const target = rank;
            const duration = 1800; 
            const stepTime = 20; 
            const steps = duration / stepTime;
            const increment = target / steps;
            
            const timer = setInterval(() => {
              current += increment;
              if (current >= target) {
                current = target;
                clearInterval(timer);
                rankResult.textContent = current.toLocaleString();
              } else {
                rankResult.textContent = Math.floor(current).toLocaleString();
              }
            }, stepTime);
            
            setTimeout(() => {
              resultSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
          });
        })();
      </script>
